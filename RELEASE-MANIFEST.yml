# === v25.4 Stability Stack ===
stability_stack:
  dev_server:
    next_version: "16.1.3"
    bundler: "webpack"  # NOT Turbopack — Turbopack's CSS pipeline panics on this project's 28 KB globals.css
    node_options: "--max-old-space-size=2048"  # prevents SIGKILL (exit 9) on PostCSS worker spawns
    telemetry_disabled: true
    port: 3000
    keep_alive: "curl /api/status every 8s — prevents sandbox idle-kill at ~25s"
    session_isolation: "setsid -f — detaches from controlling bash so SIGHUP doesn't reap the process group"
    bootstrap: "/home/z/my-project/start-dev.sh"

# === v25.4 Security Posture ===
security_posture:
  sql_injection:
    status: "closed"
    fixed_in:
      - src/lib/live-oracle.ts            # parameterized rawQuery() with ? placeholders
      - src/app/api/redeem/route.ts       # SUM() throttle query via parameterized SQL
    residual_debt:
      - src/lib/db.ts:1261                # `LIMIT ${limit}` template literal — cosmetic, low risk
  shell_injection:
    status: "closed"
    fixed_in:
      - src/app/api/oracle/update/route.ts     # spawnSync args array (no shell)
      - mini-services/mithqal-watchdog/index.ts # spawnSync args array + credential.helper=store
  unauthenticated_post_routes:
    status: "closed"
    fixed_in:
      - src/app/api/oracle/update/route.ts        # CRON_SECRET gate (503 if unset, 401 if mismatch)
      - src/app/api/rebalance/execute/route.ts    # auth runs unconditionally (session OR x-cron-secret)
      - mini-services/notify-service/index.ts     # INTERNAL_SECRET gate + CORS allowlist
      - mini-services/discord-bot/index.ts        # INTERNAL_SECRET gate
  body_size_limit:
    status: "closed"
    fixed_in:
      - src/app/api/mint/route.ts         # 64 KB max (413 Payload Too Large)
  rate_limiting:
    status: "closed"
    new_in_v25_4:
      - /api/rebalance/plan               # 10 req/min per IP (POST)
  xss_sanitization:
    status: "closed"
    fixed_in:
      - src/app/api/onchain-test/route.ts  # network param whitelist (monad, arc, local)
  secret_exposure_in_process_list:
    status: "closed"
    fixed_in:
      - src/app/api/oracle/update/route.ts  # deployer private key via args array, not shell string
      - mini-services/mithqal-watchdog/index.ts  # AES key via -pass env:VARNAME; GitHub token via credential.helper
  inngest_signing_key:
    status: "operator-action-required"
    note: "/api/inngest returns 500 in dev because INNGEST_SIGNING_KEY is not set. Set INNGEST_DEV=1 for local dev, or provision the key in Vercel env vars for production."

