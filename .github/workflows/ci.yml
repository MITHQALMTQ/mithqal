name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bunx prisma@6 generate
      - name: Lint
        run: bun run lint
      - name: Check canonical modules present
        run: |
          count=0
          for f in settlement-workflow-canonical canonical-finality-model finality-trust-domains reserve-domains reserve-coverage-logic mtq-economic-definition policy-registry external-legal-evidence institutional-evidence-fabric institutional-settlement-obligation-registry reconciliation-tolerance-policies corridor-pain-index two-pilot-modes bank-value-model pilot-gate-framework settlement-continuity-fabric contradiction-sweep-report controlled-architecture-freeze institutional-operating-model accounting-prudential-tax-framework pbc-legal-enforceability failure-resolution-legal-conditionality bank-contracting-package institutional-external-identity enterprise-risk-register insurance-risk-transfer-framework institutional-data-governance dispute-exception-framework competitive-compatibility-framework institutional-pricing-architecture institutional-gtm-framework institutionalization-operating-plan bank-onboarding-training-framework sharia-aaoifi-governance jurisdiction-truth-model technical-evidence-classification mtq-redemption-value-consistency bank-economic-incentive-model regulatory-replay-engine; do
            test -f "src/lib/$f.ts" && count=$((count+1)) || echo "::error::Missing canonical module: $f"
          done
          echo "Canonical modules: $count/39"
          [ "$count" -eq 39 ] || exit 1
